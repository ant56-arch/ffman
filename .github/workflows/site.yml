# Builds the ffman website with fresh recommendations and publishes it to GitHub Pages.
# Read-only: it never changes a lineup. Setup is in README.md ("GitHub website").
name: Website

on:
  # Times are UTC (ET + 4 during daylight time, ET + 5 from November). Odd minutes because
  # GitHub delays jobs scheduled on the hour. Every run rebuilds the site with fresh data.
  schedule:
    - cron: "7 13 * * *"              # every morning, ~9am ET: new week, waiver results
    - cron: "7 1 * * 3"               # Tuesday ~9pm ET: fresh waiver ideas before Wednesday claims
    - cron: "7,37 20-23 * * 4"        # Thursday ~4-7:30pm ET, through TNF inactives
    - cron: "7,37 13-23 * * 0"        # Sunday every 30 min, ~9am-7:30pm ET: all inactives
    - cron: "7 0 * * 1"               # Sunday ~8pm ET, before Sunday Night Football
    - cron: "7,37 20-23 * * 1"        # Monday ~4-7:30pm ET, through MNF inactives
    # Phone/Discord alerts go out only on these three runs (if configured):
    - cron: "50 21 * * 4"             # Thursday ~5:50pm ET
    - cron: "50 15 * * 0"             # Sunday ~11:50am ET, after early inactives
    - cron: "50 18 * * 0"             # Sunday ~2:50pm ET, after late inactives
  workflow_dispatch:
    inputs:
      week:
        description: "NFL week (blank = current)"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # One job builds and publishes, so it never waits in line for a second machine
  # (a separate deploy job once sat queued for 15 minutes and was cancelled).
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy-retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the site is password-protected and configured
        env:
          FFMAN_CONFIG: ${{ secrets.FFMAN_CONFIG }}
          FFMAN_SITE_USER: ${{ secrets.FFMAN_SITE_USER }}
          FFMAN_SITE_PASSWORD: ${{ secrets.FFMAN_SITE_PASSWORD }}
        run: |
          # Never publish rosters without a login.
          if [ -z "$FFMAN_SITE_USER" ] || [ -z "$FFMAN_SITE_PASSWORD" ]; then
            echo "::error::Add FFMAN_SITE_USER and FFMAN_SITE_PASSWORD repository secrets (see README)."; exit 1
          fi
          if [ -z "$FFMAN_CONFIG" ]; then
            echo "::error::Add an FFMAN_CONFIG repository secret with your config.toml contents (see README)."; exit 1
          fi
      - run: pip install cryptography
      # Projection-site data (public numbers only, no rosters) carries over between runs, so
      # the sites are read about twice a day instead of on every 30-minute Sunday update.
      - name: Reuse projection data from earlier runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/ffman
          key: ffman-data-${{ github.run_id }}
          restore-keys: ffman-data-
      - name: Build lineup recommendations
        env:
          FFMAN_CONFIG: ${{ secrets.FFMAN_CONFIG }}
          FFMAN_SITE_USER: ${{ secrets.FFMAN_SITE_USER }}
          FFMAN_SITE_PASSWORD: ${{ secrets.FFMAN_SITE_PASSWORD }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          SWID: ${{ secrets.SWID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          WEEK: ${{ github.event.inputs.week }}
          TZ: America/New_York
        run: |
          case "${{ github.event.schedule }}" in "50 21 * * 4"|"50 15 * * 0"|"50 18 * * 0") NOTIFY="--notify" ;; *) NOTIFY="" ;; esac
          # --quiet: this repo's Actions logs are public, so never print rosters there.
          python -m ffman --quiet --html _site/index.html $NOTIFY ${WEEK:+--week "$WEEK"}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true  # GitHub Pages hiccups now and then; retry once below
        timeout-minutes: 8
      - name: Wait before retrying
        if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy-retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        timeout-minutes: 8
