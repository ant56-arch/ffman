[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ffman"
version = "0.1.0"
description = "Read-only fantasy football lineup advisor for Sleeper and ESPN leagues"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ffman = "ffman.cli:main"

[tool.setuptools]
packages = ["ffman", "ffman.providers"]

[tool.setuptools.package-data]
ffman = ["config.example.toml"]
